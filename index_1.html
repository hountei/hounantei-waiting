<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>宝雲亭 中洲店 | 待受け受付</title>
<!-- 宝雲亭 待ちリストアプリ プロトタイプ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #131a24;
    --bg-deep: #0d1319;
    --panel: #1c2734;
    --panel-2: #232f3d;
    --line: #34424f;
    --red: #c74430;
    --red-bright: #e35a3f;
    --gold: #c9a13c;
    --gold-soft: #e6c874;
    --paper: #f3ecd8;
    --muted: #8b96a3;
    --font-display: "Shippori Mincho", serif;
    --font-body: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background: var(--bg); }
  .hn-root{
    background: var(--bg);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 0 40px;
    position: relative;
    overflow-x: hidden;
  }
  .hn-root::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 500px 260px at 50% -60px, rgba(199,68,48,0.20), transparent 70%),
      radial-gradient(ellipse 400px 300px at 90% 10%, rgba(201,161,60,0.08), transparent 70%);
    pointer-events:none;
  }
  .hn-shell{ max-width: 480px; margin: 0 auto; padding: 26px 20px 0; position:relative; }
  .hn-shell.wide{ max-width: 720px; }

  /* header */
  .hn-header{ text-align:center; margin-bottom: 18px; }
  .hn-mark{ display:flex; justify-content:center; margin-bottom: 10px; }
  .hn-mark svg{ width:40px; height:40px; }
  .hn-title{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.12em;
    color: var(--paper);
    margin: 0;
  }
  .hn-sub{
    font-size: 12px;
    color: var(--gold-soft);
    letter-spacing: 0.2em;
    margin-top: 6px;
  }
  .hn-tabs{
    position:absolute; top: 14px; right: 12px;
    display:flex; gap: 6px; font-size: 11px;
  }
  .hn-tab-link{
    color: var(--muted); text-decoration:none;
    border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 10px; letter-spacing: 0.05em;
    background: rgba(255,255,255,0.02);
  }
  .hn-tab-link.active{ color: var(--bg-deep); background: var(--gold-soft); border-color: var(--gold-soft); font-weight:700; }

  /* language selector */
  .hn-langs{ display:flex; gap: 6px; justify-content:center; flex-wrap: wrap; margin-bottom: 18px; }
  .hn-lang-btn{
    font-size: 12px; padding: 6px 12px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--bg-deep); color: var(--muted); cursor:pointer;
  }
  .hn-lang-btn.active{ border-color: var(--gold-soft); color: var(--gold-soft); background: rgba(201,161,60,0.12); font-weight: 700; }

  /* card */
  .hn-card{
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px 24px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  .hn-notice{
    display:flex; align-items:center; gap:10px; flex-wrap: wrap;
    background: rgba(199,68,48,0.12);
    border: 1px solid rgba(199,68,48,0.4);
    color: var(--red-bright);
    padding: 10px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.03em;
    margin-bottom: 18px;
  }
  .hn-notice .dot{ width:7px; height:7px; border-radius:50%; background:var(--red-bright); box-shadow:0 0 0 4px rgba(227,90,63,0.25); flex-shrink:0; }
  .hn-notice-count{ font-weight: 900; color: var(--gold-soft); }

  .hn-field{ margin-bottom: 18px; }
  .hn-label{ font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 8px; display:block; }
  .hn-label b{ color: var(--gold-soft); font-weight:700; margin-right: 2px; }

  .hn-stepper{ display:flex; align-items:center; gap: 14px; }
  .hn-stepbtn{
    width: 42px; height: 42px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-deep);
    color: var(--paper); font-size: 20px; font-weight: 700;
    cursor:pointer; user-select:none;
  }
  .hn-stepbtn:active{ background: var(--red); border-color: var(--red); }
  .hn-count{
    font-family: var(--font-display); font-size: 30px; font-weight: 700;
    min-width: 60px; text-align:center;
  }
  .hn-count small{ font-size: 13px; font-family: var(--font-body); color: var(--muted); margin-left: 4px; }

  .hn-input{
    width: 100%; padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-deep);
    color: var(--paper); font-family: var(--font-body); font-size: 15px;
  }
  .hn-input::placeholder{ color: #56626f; }
  .hn-input:focus, .hn-stepbtn:focus, .hn-seat input:focus + span, button:focus-visible{
    outline: 2px solid var(--gold-soft); outline-offset: 2px;
  }

  .hn-seats{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .hn-seat{ position:relative; }
  .hn-seat input{ position:absolute; opacity:0; inset:0; cursor:pointer; margin:0; }
  .hn-seat span{
    display:block; text-align:center; padding: 12px 8px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-deep); font-size: 14px; color: var(--muted);
  }
  .hn-seat input:checked + span{
    border-color: var(--gold-soft); color: var(--gold-soft); background: rgba(201,161,60,0.1); font-weight: 700;
  }

  .hn-submit{
    width:100%; margin-top: 6px; padding: 15px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    color: #fff6ee; font-family: var(--font-display); font-weight: 800; font-size: 16px;
    letter-spacing: 0.1em; cursor: pointer; box-shadow: 0 10px 24px rgba(199,68,48,0.35);
  }
  .hn-submit:disabled{ opacity: 0.6; cursor: default; }
  .hn-err{ color: var(--red-bright); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* lantern ticket */
  .hn-ticket{ text-align:center; padding: 10px 4px 4px; }
  .hn-lantern{ width: 150px; margin: 0 auto 14px; position: relative; }
  .hn-lantern svg{ width: 100%; filter: drop-shadow(0 8px 18px rgba(199,68,48,0.4)); }
  .hn-ticket-num{
    font-family: var(--font-display); font-size: 15px; color: var(--gold-soft); letter-spacing:0.2em;
  }
  .hn-ticket-name{ font-size: 18px; font-weight: 700; margin-top: 10px; }
  .hn-ticket-meta{ color: var(--muted); font-size: 13px; margin-top: 4px; }
  .hn-ticket-status{
    margin-top: 18px; padding: 10px; border-radius: 10px;
    background: rgba(201,161,60,0.1); border: 1px solid rgba(201,161,60,0.35);
    color: var(--gold-soft); font-size: 13px; font-weight: 700;
  }
  .hn-ticket-status.called{ background: rgba(199,68,48,0.16); border-color: rgba(199,68,48,0.5); color: var(--red-bright); }
  .hn-back{ margin-top: 16px; background:none; border:none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor:pointer; }

  /* staff view */
  .hn-summary{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px;
  }
  .hn-summary-item{
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 6px; text-align: center;
  }
  .hn-summary-num{ font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--gold-soft); }
  .hn-summary-label{ font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 0.03em; }
  .hn-staffbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
  .hn-staffbar .hn-updated{ font-size: 11px; color: var(--muted); }
  .hn-reset{
    font-size: 11px; color: var(--muted); background:none; border: 1px solid var(--line);
    border-radius: 20px; padding: 5px 10px; cursor:pointer;
  }
  .hn-empty{ text-align:center; color: var(--muted); padding: 40px 10px; font-size: 13px; }
  .hn-row{
    display:flex; align-items:center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .hn-row.called{ border-color: rgba(199,68,48,0.5); background: rgba(199,68,48,0.08); }
  .hn-row-num{
    font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--gold-soft);
    width: 34px; text-align:center; flex-shrink:0;
  }
  .hn-row-main{ flex: 1; min-width:0; }
  .hn-row-name{ font-weight: 700; font-size: 15px; }
  .hn-row-sub{ font-size: 12px; color: var(--muted); margin-top: 2px; display:flex; gap:8px; flex-wrap:wrap; }
  .hn-badge{
    font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted);
  }
  .hn-badge.called{ color: var(--red-bright); border-color: var(--red-bright); }
  .hn-badge.done{ color: #8fd1a4; border-color: #5c8a6b; }
  .hn-badge.cancelled{ color: var(--muted); }
  .hn-row-actions{ display:flex; gap: 6px; flex-shrink:0; }
  .hn-abtn{
    font-size: 11px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg-deep); color: var(--paper); cursor:pointer; white-space:nowrap;
  }
  .hn-abtn.call{ border-color: var(--gold-soft); color: var(--gold-soft); }
  .hn-abtn.done{ border-color: #5c8a6b; color: #8fd1a4; }
  .hn-abtn.cancel{ color: var(--muted); }

  /* history panel */
  .hn-history{ margin-bottom: 16px; }
  .hn-history-toggle{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; color: var(--paper); font-size: 13px; font-weight: 700; cursor:pointer;
  }
  .hn-history-toggle .hn-chev{ color: var(--gold-soft); font-size: 11px; font-weight: 700; }
  .hn-history-list{ margin-top: 8px; }
  .hn-history-row{
    display:flex; align-items:center; gap: 12px;
    background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 8px; opacity: 0.85;
  }
  .hn-history-row .hn-row-num{ font-size: 16px; }
  .hn-history-row .hn-row-name{ font-size: 14px; }

  @media (max-width: 400px){
    .hn-row{ flex-wrap: wrap; }
    .hn-row-actions{ width: 100%; justify-content:flex-end; }
  }
</style>
</head>

  async function withRetry(fn, attempts){
    attempts = attempts || 3;
    let lastErr;
    for(let i=0;i<attempts;i++){
      try{ return await fn(); }
      catch(e){
        lastErr = e;
        console.error('[宝雲亭] storage call failed (attempt '+(i+1)+'/'+attempts+'):', e);
        if(i < attempts-1) await new Promise(r=>setTimeout(r, 400 * (i+1)));
      }
    }
    throw lastErr;
  }

  async function loadState(){
    try{
      const res = await withRetry(()=>window.storage.get(STORAGE_KEY, true), 2);
      if(res && res.value){ state = JSON.parse(res.value); }
    }catch(e){ /* key not found yet, or genuinely unreachable — fall back to in-memory state */ }
  }
  async function saveState(){
    await withRetry(()=>window.storage.set(STORAGE_KEY, JSON.stringify(state), true), 3);
  }
  async function verifyEntrySaved(id){
    // Unlike loadState(), this does not swallow errors — callers need to know
    // whether the confirmation read itself succeeded, not just fall back silently.
    const res = await withRetry(()=>window.storage.get(STORAGE_KEY, true), 2);
    if(res && res.value){
      const remote = JSON.parse(res.value);
      return remote.entries.some(e => e.id === id);
    }
    return false;
  }
  async function loadMyTicket(){
    try{
      const res = await withRetry(()=>window.storage.get(TICKET_KEY, false), 2);
      if(res && res.value){ myTicketId = res.value; }
    }catch(e){ /* not set yet */ }
  }
  async function saveMyTicket(id){
    try{ await withRetry(()=>window.storage.set(TICKET_KEY, id, false), 2); }catch(e){ console.error('[宝雲亭] failed to save ticket id:', e); }
  }
  async function clearMyTicket(){
    try{ await withRetry(()=>window.storage.delete(TICKET_KEY, false), 2); }catch(e){ console.error('[宝雲亭] failed to clear ticket id:', e); }
  }

  function isToday(ts){
    const d = new Date(ts), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }
  function timeAgo(ts){
    const tr = T[lang];
    const min = Math.max(0, Math.floor((Date.now() - ts)/60000));
    if(min < 1) return tr.justNow;
    return tr.waitMin(min);
  }

  function render(){
    if(view === 'staff') renderStaff(); else renderCustomer();
  }

  function tabsHTML(){
    // Used on the staff page only — lets staff jump back to the customer view for testing.
    return '<div class="hn-tabs">'+
      '<a class="hn-tab-link" href="#" data-nav="customer">受付</a>'+
      '<a class="hn-tab-link active" href="#" data-nav="staff">スタッフ</a>'+
      '</div>';
  }
  function customerTabsHTML(){
    const tr = T[lang];
    return '<div class="hn-tabs" style="position:static; margin-bottom:14px; justify-content:center;">'+
      '<a class="hn-tab-link '+(customerSubview==='checkin'?'active':'')+'" href="#" data-subview="checkin">'+tr.tabCheckin+'</a>'+
      '<a class="hn-tab-link '+(customerSubview==='status'?'active':'')+'" href="#" data-subview="status">'+tr.tabStatus+'</a>'+
      '</div>';
  }
  function bindCustomerTabs(){
    root.querySelectorAll('[data-subview]').forEach(a=>{
      a.onclick = (ev)=>{ ev.preventDefault(); customerSubview = a.getAttribute('data-subview'); render(); };
    });
  }
  function langBarHTML(){
    return '<div class="hn-langs">'+
      LANGS.map(l=>'<button type="button" class="hn-lang-btn '+(lang===l.code?'active':'')+'" data-lang="'+l.code+'">'+l.label+'</button>').join('')+
      '</div>';
  }
  function bindLangBar(){
    root.querySelectorAll('[data-lang]').forEach(b=>{
      b.onclick = ()=>{ lang = b.getAttribute('data-lang'); render(); };
    });
  }

  function renderCustomer(){
    if(customerSubview === 'status'){ renderCustomerStatus(); return; }

    const tr = T[lang];
    const myTicket = myTicketId ? state.entries.find(e => e.id === myTicketId) : null;
    const waitingCount = state.entries.filter(e => e.status==='waiting' || e.status==='called').length;

    if(myTicket){
      root.innerHTML =
        '<div class="hn-shell">'+
        '<div class="hn-header"><div class="hn-mark">'+markSVG()+'</div>'+
        '<h1 class="hn-title">宝雲亭</h1><div class="hn-sub">'+tr.subTicket+'</div></div>'+
        customerTabsHTML()+
        langBarHTML()+
        '<div class="hn-card hn-ticket">'+
          '<div class="hn-lantern">'+lanternSVG()+'</div>'+
          '<div class="hn-ticket-num">'+tr.ticketNo+' &nbsp;No.'+myTicket.number+'</div>'+
          '<div class="hn-ticket-name">'+escapeHTML(tr.party(myTicket.name, myTicket.count))+'</div>'+
          '<div class="hn-ticket-meta">'+escapeHTML(tr.wish(tr.seats[myTicket.seat] || myTicket.seat))+'</div>'+
          '<div class="hn-ticket-status '+(myTicket.status==='called'?'called':'')+'">'+
            (myTicket.status==='called' ? tr.statusCalled :
             myTicket.status==='waiting' ? tr.statusWaiting(timeAgo(myTicket.createdAt)) :
             tr.statusEnded) +
          '</div>'+
          (myTicket.status!=='waiting' && myTicket.status!=='called' ?
            '<button class="hn-back" id="hnNewEntry">'+tr.newEntry+'</button>' : '')+
        '</div></div>';
      if(document.getElementById('hnNewEntry')){
        document.getElementById('hnNewEntry').onclick = async ()=>{ myTicketId=null; await clearMyTicket(); render(); };
      }
      bindCustomerTabs(); bindLangBar();
      return;
    }

    root.innerHTML =
      '<div class="hn-shell">'+
      '<div class="hn-header"><div class="hn-mark">'+markSVG()+'</div>'+
      '<h1 class="hn-title">宝雲亭</h1><div class="hn-sub">'+tr.subCustomer+'</div></div>'+
      customerTabsHTML()+
      langBarHTML()+
      '<div class="hn-card">'+
        '<div class="hn-notice"><span class="dot"></span>'+tr.noticeText+
          '<span class="hn-notice-count">'+tr.waitingSuffix(waitingCount)+'</span></div>'+
        '<div class="hn-field"><span class="hn-label"><b>'+tr.countLabelB+'</b>'+tr.countLabelR+'</span>'+
          '<div class="hn-stepper">'+
            '<button type="button" class="hn-stepbtn" id="hnMinus">−</button>'+
            '<div class="hn-count" id="hnCountVal">2<small>'+tr.unit+'</small></div>'+
            '<button type="button" class="hn-stepbtn" id="hnPlus">＋</button>'+
          '</div>'+
        '</div>'+
        '<div class="hn-field"><span class="hn-label"><b>'+tr.nameLabelB+'</b></span>'+
          '<input class="hn-input" id="hnName" placeholder="'+tr.namePlaceholder+'" maxlength="20">'+
        '</div>'+
        '<div class="hn-field"><span class="hn-label"><b>'+tr.seatLabelB+'</b></span>'+
          '<div class="hn-seats">'+
            SEAT_KEYS.map((k,i)=>'<label class="hn-seat"><input type="radio" name="hnSeat" value="'+k+'" '+(i===2?'checked':'')+'><span>'+tr.seats[k]+'</span></label>').join('')+
          '</div>'+
        '</div>'+
        '<button class="hn-submit" id="hnSubmit">'+tr.submit+'</button>'+
        '<div class="hn-err" id="hnErr"></div>'+
      '</div></div>';

    let count = 2;
    const countEl = document.getElementById('hnCountVal');
    document.getElementById('hnMinus').onclick = ()=>{ count = Math.max(1,count-1); countEl.innerHTML = count+'<small>'+tr.unit+'</small>'; };
    document.getElementById('hnPlus').onclick = ()=>{ count = Math.min(20,count+1); countEl.innerHTML = count+'<small>'+tr.unit+'</small>'; };

    document.getElementById('hnSubmit').onclick = async ()=>{
      const name = document.getElementById('hnName').value.trim();
      const errEl = document.getElementById('hnErr');
      if(!name){ errEl.textContent = tr.errName; return; }
      const seatKey = document.querySelector('input[name="hnSeat"]:checked').value;
      const btn = document.getElementById('hnSubmit');
      btn.disabled = true; btn.textContent = tr.submitting;

      await loadState();
      state.counter += 1;
      const entry = {
        id: 'w'+Date.now()+Math.random().toString(36).slice(2,6),
        number: state.counter,
        name, count, seat: seatKey,
        status: 'waiting',
        createdAt: Date.now()
      };
      state.entries.push(entry);

      // Move to the ticket screen right away — saving happens in the background.
      // (The save itself reliably lands even on the rare occasion the client-side
      // acknowledgement is slow or drops, so there's no need to block on it here.)
      myTicketId = entry.id;
      render();

      saveState().catch(saveErr=>{
        console.error('[宝雲亭] saveState reported an error, verifying against storage:', saveErr);
        verifyEntrySaved(entry.id).then(ok=>{
          if(!ok) console.error('[宝雲亭] entry could not be confirmed as saved:', entry.id);
        }).catch(verifyErr=>{
          console.error('[宝雲亭] verification read also failed:', verifyErr);
        });
      });
      saveMyTicket(myTicketId);
    };
    bindCustomerTabs(); bindLangBar();
  }

  function renderCustomerStatus(){
    const tr = T[lang];
    const active = state.entries.filter(e => e.status==='waiting' || e.status==='called')
      .sort((a,b)=>a.number-b.number);
    const longestWaitMin = active.length ? Math.max(...active.map(e=>Math.floor((Date.now()-e.createdAt)/60000))) : 0;

    root.innerHTML =
      '<div class="hn-shell">'+
      '<div class="hn-header"><div class="hn-mark">'+markSVG()+'</div>'+
      '<h1 class="hn-title">宝雲亭</h1><div class="hn-sub">'+tr.statusHeading+'</div></div>'+
      customerTabsHTML()+
      langBarHTML()+
      '<div class="hn-summary">'+
        '<div class="hn-summary-item"><div class="hn-summary-num">'+active.length+'</div><div class="hn-summary-label">'+tr.statusCountLabel+'</div></div>'+
        '<div class="hn-summary-item"><div class="hn-summary-num">'+(active.length? longestWaitMin+tr.minUnit : '−')+'</div><div class="hn-summary-label">'+tr.statusLongestLabel+'</div></div>'+
      '</div>'+
      '<div class="hn-card">'+
        (active.length===0 ? '<div class="hn-empty">'+tr.statusEmpty+'</div>' :
          '<div class="hn-label" style="margin-bottom:10px;">'+tr.statusListLabel+'</div>'+
          '<div style="display:flex; flex-wrap:wrap; gap:8px;">'+
            active.map(e=>'<span class="hn-badge '+(e.status==='called'?'called':'')+'" style="font-size:13px; padding:6px 12px;">No.'+e.number+'</span>').join('')+
          '</div>')+
      '</div></div>';
    bindCustomerTabs(); bindLangBar();
  }

  function seatLabel(key){
    return (T.ja.seats[key]) || key;
  }

  function renderStaff(){
    const active = state.entries.filter(e => e.status==='waiting' || e.status==='called')
      .sort((a,b)=>a.number-b.number);
    const waitingOnly = active.filter(e=>e.status==='waiting');
    const longestWaitMin = active.length ? Math.max(...active.map(e=>Math.floor((Date.now()-e.createdAt)/60000))) : 0;
    const history = state.entries.filter(e => (e.status==='done' || e.status==='cancelled') && isToday(e.createdAt))
      .sort((a,b)=>b.number-a.number);

    root.innerHTML =
      '<div class="hn-shell wide">'+ tabsHTML() +
      '<div class="hn-header"><div class="hn-mark">'+markSVG()+'</div>'+
      '<h1 class="hn-title">宝雲亭</h1><div class="hn-sub">スタッフ用 待ちリスト管理</div></div>'+
      '<div class="hn-summary">'+
        '<div class="hn-summary-item"><div class="hn-summary-num">'+active.length+'</div><div class="hn-summary-label">現在お待ちの組数</div></div>'+
        '<div class="hn-summary-item"><div class="hn-summary-num">'+waitingOnly.length+'</div><div class="hn-summary-label">未呼出</div></div>'+
        '<div class="hn-summary-item"><div class="hn-summary-num">'+(active.length? longestWaitMin+'分' : '−')+'</div><div class="hn-summary-label">最長待ち時間</div></div>'+
      '</div>'+
      '<div class="hn-history">'+
        '<button class="hn-history-toggle" id="hnHistToggle">'+
          '<span>本日の対応済みお客様（'+history.length+'組）</span>'+
          '<span class="hn-chev">'+(historyOpen?'閉じる ▲':'開く ▼')+'</span>'+
        '</button>'+
        (historyOpen ? '<div class="hn-history-list">'+
          (history.length===0 ? '<div class="hn-empty">本日対応済みのお客様はまだいません</div>' :
            history.map(historyRowHTML).join(''))+
          '</div>' : '')+
      '</div>'+
      '<div class="hn-card">'+
        '<div class="hn-staffbar"><span class="hn-updated">'+active.length+'組が待機中です</span>'+
        '<button class="hn-reset" id="hnReset">本日の受付をリセット</button></div>'+
        (active.length===0 ? '<div class="hn-empty">現在、待っているお客様はいません</div>' :
          active.map(rowHTML).join('')) +
      '</div></div>';
    bindTabs();

    document.getElementById('hnHistToggle').onclick = ()=>{ historyOpen = !historyOpen; render(); };
    document.getElementById('hnReset').onclick = async ()=>{
      if(!confirm('本日の受付リストをすべてリセットします。よろしいですか？')) return;
      state = { counter: 0, entries: [] };
      await saveState();
      render();
    };
    root.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-id');
        const act = btn.getAttribute('data-act');
        const entry = state.entries.find(e=>e.id===id);
        if(!entry) return;
        if(act==='call') entry.status='called';
        if(act==='done'){ entry.status='done'; entry.finishedAt = Date.now(); }
        if(act==='cancel'){ entry.status='cancelled'; entry.finishedAt = Date.now(); }
        await saveState();
        render();
      };
    });
  }

  function rowHTML(e){
    return '<div class="hn-row '+(e.status==='called'?'called':'')+'">'+
      '<div class="hn-row-num">'+e.number+'</div>'+
      '<div class="hn-row-main">'+
        '<div class="hn-row-name">'+escapeHTML(e.name)+' 様　'+e.count+'名</div>'+
        '<div class="hn-row-sub"><span>'+seatLabel(e.seat)+'</span><span>'+timeAgoJa(e.createdAt)+'</span>'+
          '<span class="hn-badge '+(e.status==='called'?'called':'')+'">'+(e.status==='called'?'呼出済':'待機中')+'</span></div>'+
      '</div>'+
      '<div class="hn-row-actions">'+
        (e.status==='waiting' ? '<button class="hn-abtn call" data-act="call" data-id="'+e.id+'">呼び出す</button>' : '')+
        '<button class="hn-abtn done" data-act="done" data-id="'+e.id+'">案内完了</button>'+
        '<button class="hn-abtn cancel" data-act="cancel" data-id="'+e.id+'">取消</button>'+
      '</div></div>';
  }

  function historyRowHTML(e){
    const waited = e.finishedAt ? Math.max(0, Math.floor((e.finishedAt - e.createdAt)/60000)) : null;
    const statusLabel = e.status==='done' ? '案内済み' : '取消';
    return '<div class="hn-history-row">'+
      '<div class="hn-row-num">'+e.number+'</div>'+
      '<div class="hn-row-main">'+
        '<div class="hn-row-name">'+escapeHTML(e.name)+' 様　'+e.count+'名</div>'+
        '<div class="hn-row-sub"><span>'+seatLabel(e.seat)+'</span>'+
          (waited!==null ? '<span>待ち時間 '+waited+'分</span>' : '')+
          '<span class="hn-badge '+(e.status==='done'?'done':'cancelled')+'">'+statusLabel+'</span></div>'+
      '</div></div>';
  }

  function timeAgoJa(ts){
    const min = Math.max(0, Math.floor((Date.now() - ts)/60000));
    if(min < 1) return 'たった今';
    return min + '分待ち';
  }

  function bindTabs(){
    root.querySelectorAll('[data-nav]').forEach(a=>{
      a.onclick = (ev)=>{ ev.preventDefault(); view = a.getAttribute('data-nav'); render(); };
    });
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function isEditingForm(){
    // The customer entry form (no ticket yet) has live text/selection input.
    // Skip re-rendering it once it's already on screen, so background polling
    // doesn't wipe what someone typed — but only once it actually exists;
    // otherwise the very first render would never happen.
    return view === 'customer' && !myTicketId && !!root.querySelector('#hnSubmit');
  }

  async function tick(){
    if(busy) return;
    busy = true;
    try{
      await loadState();
      if(!isEditingForm()) render();
    }
    catch(e){ /* ignore transient errors */ }
    busy = false;
  }

  (async function init(){
    root.innerHTML = '<div class="hn-shell"><div class="hn-header"><div class="hn-sub">読み込み中…</div></div></div>';
    await loadMyTicket();
    await tick();
    pollTimer = setInterval(tick, 4000);
  })();
})();
</script>

</body>
</html>
